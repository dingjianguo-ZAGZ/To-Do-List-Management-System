spring:
  application:
    name: todo-list-management-system

  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/todolist?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate配置
  jpa:
    hibernate:
      ddl-auto: update  # 生产环境建议改为 validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Redis配置（可选，用于缓存和会话管理）
  redis:
    port: 6379
    password:  # 如果Redis没有设置密码，保持为空
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # 邮件配置（用于发送提醒通知）
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com  # 请修改为您的邮箱
    password: your-email-password   # 请修改为您的邮箱密码或应用专用密码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  data:
    redis:
      host: localhost

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT配置
jwt:
  secret: suhongrun18834274658  # 生产环境请使用更安全的密钥
  expiration: 86400000 # 24小时 (毫秒)

# 应用自定义配置
app:
  backup:
    auto-enabled: true
    schedule: "0 0 2 * * ?" # 每天凌晨2点自动备份
    path: ./backups

  reminder:
    work-hours-start: 9
    work-hours-end: 18
    work-days-only: true

# 日志配置
logging:
  level:
    root: INFO
    com.todolist: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/todolist.log
